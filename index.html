const $=id=>document.getElementById(id);
let subject='geo',activeUnit=null,chosenSize=10,questions=[],i=0,correct=0,errors=[],answered=false;
const subjectName=()=>SUBJECTS.find(x=>x[0]===subject)[2];
function show(page){['home','setup','quiz','result','review'].forEach(x=>$(x).classList.toggle('hidden',x!==page));window.scrollTo(0,0);}
function selectSubject(s){subject=s;activeUnit=null;renderSubjects();renderHome();show('home');}
function renderSubjects(){let nav=$('subjects');nav.replaceChildren();SUBJECTS.forEach(([id,emoji,name])=>{let b=document.createElement('button');b.className='subject'+(subject===id?' on':'');b.textContent=emoji+' '+name;b.setAttribute('aria-current',subject===id?'page':'false');b.onclick=()=>selectSubject(id);nav.append(b);});}
function renderHome(){$('crumb').textContent='Mis asignaturas / '+subjectName();$('subjectTitle').textContent=subjectName();let units=CATALOG[subject]||[];$('subjectDesc').textContent=units.length?'Elige un tema para empezar a estudiar.':'Aquí iremos añadiendo los temas y los test según los apuntes que nos envíes.';let area=$('units');area.replaceChildren();if(!units.length){let msg=document.createElement('div');msg.className='empty';msg.textContent='📚 Todavía no hay apuntes de esta asignatura. Se incorporarán aquí los próximos temas.';area.append(msg);}else units.forEach(unit=>{let b=document.createElement('button');b.className='unit';let block=document.createElement('div'),strong=document.createElement('strong'),small=document.createElement('small'),arrow=document.createElement('span');strong.textContent=unit.title;small.textContent=unit.desc+' · '+unit.questions.length+' preguntas';arrow.textContent='→';block.append(strong,small);b.append(block,arrow);b.onclick=()=>{activeUnit=unit;chosenSize=10;document.querySelectorAll('.mode').forEach(m=>m.classList.toggle('on',m.dataset.size==='10'));$('unitLabel').textContent=subjectName();$('unitTitle').textContent=unit.title;show('setup');};area.append(b);});}
function shuffle(arr){let a=[...arr];for(let j=a.length-1;j>0;j--){let k=Math.floor(Math.random()*(j+1));[a[j],a[k]]=[a[k],a[j]]}return a;}
document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{document.querySelectorAll('.mode').forEach(x=>x.classList.remove('on'));b.classList.add('on');chosenSize=b.dataset.size==='all'?'all':Number(b.dataset.size);});
function begin(items){questions=shuffle(items);i=0;correct=0;errors=[];render();show('quiz');}
$('start').onclick=()=>begin(shuffle(activeUnit.questions).slice(0,chosenSize==='all'?activeUnit.questions.length:chosenSize));
function render(){answered=false;const q=questions[i];$('counter').textContent=`Pregunta ${i+1} de ${questions.length}`;$('points').textContent=`⭐ ${correct} aciertos`;$('bar').style.width=`${Math.round(i/questions.length*100)}%`;$('topic').textContent=q[0];$('question').textContent=q[1];$('feedback').classList.add('hidden');$('reason').classList.add('hidden');$('next').classList.add('hidden');$('next').textContent=i===questions.length-1?'Ver resultado →':'Siguiente pregunta →';$('answers').replaceChildren();q[2].forEach((v,j)=>{let b=document.createElement('button');b.className='option';let key=document.createElement('b');key.textContent='ABCD'[j];let label=document.createElement('span');label.textContent=v;b.append(key,label);b.onclick=()=>pick(j);$('answers').append(b);});}
function pick(n){if(answered)return;answered=true;const q=questions[i],ok=n===q[3];if(ok)correct++;else errors.push({q,selected:n});[...$('answers').children].forEach((b,j)=>{b.disabled=true;if(j===q[3])b.classList.add('right');else if(j===n)b.classList.add('wrong')});$('points').textContent=`⭐ ${correct} aciertos`;let f=$('feedback');f.className='feedback'+(ok?'':' no');f.textContent=ok?'✅ ¡Muy bien! Has acertado.':'❌ La respuesta correcta es: '+q[2][q[3]]+'.';$('reasonText').textContent=q[4];$('reason').classList.remove('hidden');$('next').classList.remove('hidden');$('bar').style.width=`${Math.round((i+1)/questions.length*100)}%`;}
$('next').onclick=()=>{i++;if(i<questions.length)render();else finish();};
function finish(){show('result');let pct=Math.round(correct/questions.length*100);$('finalScore').textContent=`${correct} / ${questions.length}`;$('resultTitle').textContent=pct>=90?'¡Excelente trabajo! 🌟':pct>=70?'¡Vas muy bien! 👏':pct>=50?'¡A seguir practicando! 💪':'¡Lo conseguirás! 📚';$('resultText').textContent=`Has acertado ${correct} y fallado ${errors.length} de ${questions.length} preguntas (${pct}% de aciertos).`;$('mistakes').classList.toggle('hidden',!errors.length);$('reviewbtn').classList.toggle('hidden',!errors.length);}
function review(){show('review');$('reviewSummary').textContent=`Has fallado ${errors.length} pregunta${errors.length===1?'':'s'}. Estas son las respuestas correctas y sus explicaciones:`;let el=$('wronglist');el.replaceChildren();errors.forEach(({q,selected},j)=>{let card=document.createElement('div');card.className='wrongitem';let title=document.createElement('strong');title.textContent=(j+1)+'. '+q[1];let yours=document.createElement('p');yours.textContent='❌ Marcaste: '+q[2][selected];let right=document.createElement('p');right.className='correct';right.textContent='✅ Correcta: '+q[2][q[3]];let reason=document.createElement('p');reason.textContent='📖 '+q[4];card.append(title,yours,right,reason);el.append(card);});}
$('reviewbtn').onclick=review;$('backresult').onclick=()=>show('result');$('mistakes').onclick=()=>{if(errors.length)begin(errors.map(e=>e.q))};$('reviewretry').onclick=()=>{if(errors.length)begin(errors.map(e=>e.q))};$('reviewhome').onclick=()=>{renderHome();show('home')};$('retry').onclick=()=>show('setup');$('quit').onclick=()=>show('setup');$('backhome').onclick=()=>show('home');
const UPDATE_URL='contenido.json';
function statusUpdate(msg){const b=$('updateStatus');b.classList.remove('hidden');b.textContent=msg;}
function validCatalog(payload){if(!payload || typeof payload!=='object'||!payload.asignaturas||typeof payload.asignaturas!=='object')throw Error('Formato de contenido incorrecto.');const next={...CATALOG};for(const [id,units] of Object.entries(payload.asignaturas)){if(!SUBJECTS.some(x=>x[0]===id)||!Array.isArray(units))throw Error('Asignatura desconocida.');const existing=[...(next[id]||[])];for(const unit of units){if(typeof unit.id!=='string'||typeof unit.title!=='string'||!Array.isArray(unit.questions)||unit.questions.length===0)throw Error('Tema incompleto.');if(!unit.questions.every(q=>Array.isArray(q)&&q.length===5&&typeof q[0]==='string'&&typeof q[1]==='string'&&Array.isArray(q[2])&&q[2].length===4&&q[2].every(a=>typeof a==='string')&&Number.isInteger(q[3])&&q[3]>=0&&q[3]<4&&typeof q[4]==='string'))throw Error('Las preguntas necesitan cuatro respuestas y una explicación.');const ix=existing.findIndex(t=>t.id===unit.id);const parsed={id:unit.id,title:unit.title,desc:unit.desc||'',questions:unit.questions};if(ix<0)existing.push(parsed);else existing[ix]=parsed;}next[id]=existing;}return next;}
function applyCatalog(payload){const next=validCatalog(payload);CATALOG=next;try{localStorage.setItem('ainara-content-v1',JSON.stringify(payload));}catch(e){}selectSubject(subject);let count=Object.values(payload.asignaturas).reduce((n,u)=>n+u.length,0);statusUpdate(`✅ Contenido actualizado: ${count} tema(s) del paquete. Ya puedes estudiarlos.`);}
function loadStored(){try{const saved=localStorage.getItem('ainara-content-v1');if(saved)CATALOG=validCatalog(JSON.parse(saved));}catch(e){}}
async function updateRemote(){statusUpdate('Buscando nuevos temas…');try{const r=await fetch(UPDATE_URL+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('No se encontró el fichero actualizado.');applyCatalog(await r.json());}catch(e){statusUpdate('No se pudo descargar contenido nuevo. Si abriste un archivo descargado, debes instalar la versión alojada en una web. También puedes importar un archivo de temas aquí abajo.');showImport();}}
function showImport(){if($('importTopics'))return;const container=$('updateStatus'),label=document.createElement('label');label.id='importTopics';label.style.display='block';label.style.marginTop='12px';label.style.fontWeight='700';label.textContent='📁 Importar fichero de temas (JSON): ';const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';inp.style.display='block';inp.style.marginTop='8px';inp.onchange=async()=>{const file=inp.files&&inp.files[0];if(!file)return;try{applyCatalog(JSON.parse(await file.text()));}catch(e){statusUpdate('❌ No se pudo importar: '+e.message);showImport();}};label.append(inp);container.append(label);}
$('goHome').onclick=()=>{selectSubject('geo');};
$('updateBtn').onclick=updateRemote;
loadStored();
if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
renderSubjects();renderHome();
</script></body></html>
